<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Firestore - SHOR</title>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    <style>
        body {
            font-family: monospace;
            padding: 20px;
            background: #1a1a1a;
            color: #00ff00;
            max-width: 800px;
            margin: 0 auto;
        }
        .section {
            margin: 20px 0;
            padding: 15px;
            border: 1px solid #00ff00;
            border-radius: 5px;
        }
        h2 { color: #00ffff; }
        button {
            background: #00ff00;
            color: #000;
            border: none;
            padding: 10px 20px;
            cursor: pointer;
            font-weight: bold;
            margin: 5px;
            font-family: monospace;
        }
        button:hover { background: #00ffff; }
        pre {
            background: #000;
            padding: 10px;
            border-radius: 5px;
            overflow-x: auto;
            white-space: pre-wrap;
        }
        .success { color: #00ff00; }
        .error { color: #ff0000; }
        .warning { color: #ffff00; }
    </style>
</head>
<body>
    <h1>🔍 Test Firestore - SHOR</h1>
    
    <div class="section">
        <h2>📊 Estado</h2>
        <div id="status">Inicializando...</div>
    </div>

    <div class="section">
        <h2>🧪 Pruebas</h2>
        <button onclick="testGuardarUsuario()">1. Guardar Usuario</button>
        <button onclick="testGuardarNota()">2. Guardar Nota</button>
        <button onclick="testLeerDatos()">3. Leer Datos</button>
        <button onclick="testTodo()">4. Test Completo</button>
    </div>

    <div class="section">
        <h2>📝 Resultados</h2>
        <pre id="output">Esperando pruebas...</pre>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyCVuKY4yYUawd50iUFbTeYFWcZd2Lmvv_Q",
            authDomain: "shor-pwa.firebaseapp.com",
            projectId: "shor-pwa",
            storageBucket: "shor-pwa.firebasestorage.app",
            messagingSenderId: "113185407112",
            appId: "1:113185407112:web:e8f7b0a5d4c3b2a1f6e5d4"
        };

        let firestoreDB = null;
        let deviceId = null;
        const output = document.getElementById('output');
        const status = document.getElementById('status');

        function log(message, type = 'info') {
            const timestamp = new Date().toLocaleTimeString();
            const color = type === 'error' ? 'error' : type === 'success' ? 'success' : type === 'warning' ? 'warning' : '';
            output.innerHTML += `<span class="${color}">[${timestamp}] ${message}</span>\n`;
            console.log(message);
        }

        function clearOutput() {
            output.innerHTML = '';
        }

        // Inicializar Firebase
        try {
            firebase.initializeApp(firebaseConfig);
            firestoreDB = firebase.firestore();
            
            deviceId = localStorage.getItem('test_deviceId');
            if (!deviceId) {
                deviceId = 'test_' + Date.now() + '_' + Math.random().toString(36).substr(2, 9);
                localStorage.setItem('test_deviceId', deviceId);
            }
            
            status.innerHTML = `<span class="success">✅ Firestore conectado</span><br>Device ID: ${deviceId}`;
            log('Firestore inicializado correctamente', 'success');
            log('Device ID: ' + deviceId);
        } catch (error) {
            status.innerHTML = `<span class="error">❌ Error: ${error.message}</span>`;
            log('Error al inicializar: ' + error.message, 'error');
        }

        async function testGuardarUsuario() {
            clearOutput();
            log('=== TEST: Guardar Usuario ===');
            
            const persona = {
                id: 'persona_' + Date.now(),
                nombre: 'Test Usuario',
                rol: 'Operativo',
                createdAt: new Date().toISOString()
            };

            try {
                log('Guardando usuario en Firestore...');
                await firestoreDB.collection('users').doc(deviceId).set({
                    persona: persona,
                    createdAt: new Date().toISOString()
                }, { merge: true });
                
                log('✅ Usuario guardado correctamente', 'success');
                log('Persona ID: ' + persona.id);
                log('Nombre: ' + persona.nombre);
                log('Rol: ' + persona.rol);
            } catch (error) {
                log('❌ Error al guardar usuario: ' + error.message, 'error');
                log('Código: ' + error.code, 'error');
            }
        }

        async function testGuardarNota() {
            clearOutput();
            log('=== TEST: Guardar Nota ===');
            
            const registro = {
                id: 'reg_' + Date.now() + '_' + Math.random().toString(36).substr(2, 9),
                personaId: 'persona_test',
                tipo: 'texto',
                contenido: 'Nota de prueba - ' + new Date().toLocaleTimeString(),
                fecha: new Date().toISOString().split('T')[0],
                timestamp: new Date().toISOString()
            };

            try {
                log('Guardando nota en Firestore...');
                log('Ruta: registros/' + deviceId + '/items/' + registro.id);
                
                await firestoreDB.collection('registros').doc(deviceId)
                    .collection('items').doc(registro.id).set(registro);
                
                log('✅ Nota guardada correctamente', 'success');
                log('Registro ID: ' + registro.id);
                log('Tipo: ' + registro.tipo);
                log('Contenido: ' + registro.contenido);
                log('Fecha: ' + registro.fecha);
                log('Timestamp: ' + registro.timestamp);
            } catch (error) {
                log('❌ Error al guardar nota: ' + error.message, 'error');
                log('Código: ' + error.code, 'error');
                
                if (error.code === 'permission-denied') {
                    log('⚠️ SOLUCIÓN: Configurar reglas en Firestore Console', 'warning');
                    log('URL: https://console.firebase.google.com/project/shor-pwa/firestore', 'warning');
                }
            }
        }

        async function testLeerDatos() {
            clearOutput();
            log('=== TEST: Leer Datos ===');
            
            try {
                // Leer usuario
                log('Leyendo usuario...');
                const userDoc = await firestoreDB.collection('users').doc(deviceId).get();
                if (userDoc.exists) {
                    log('✅ Usuario encontrado:', 'success');
                    log(JSON.stringify(userDoc.data(), null, 2));
                } else {
                    log('⚠️ Usuario no encontrado', 'warning');
                }

                // Leer notas
                log('\nLeyendo notas...');
                const notasSnapshot = await firestoreDB.collection('registros').doc(deviceId)
                    .collection('items').get();
                
                if (notasSnapshot.empty) {
                    log('⚠️ No hay notas guardadas', 'warning');
                } else {
                    log(`✅ ${notasSnapshot.size} notas encontradas:`, 'success');
                    notasSnapshot.forEach(doc => {
                        const data = doc.data();
                        log(`\n- ${data.tipo}: ${data.contenido}`);
                        log(`  Fecha: ${data.fecha} ${data.timestamp}`);
                    });
                }
            } catch (error) {
                log('❌ Error al leer datos: ' + error.message, 'error');
                log('Código: ' + error.code, 'error');
            }
        }

        async function testTodo() {
            clearOutput();
            log('=== TEST COMPLETO ===\n');
            
            await testGuardarUsuario();
            await new Promise(resolve => setTimeout(resolve, 1000));
            
            log('\n');
            await testGuardarNota();
            await new Promise(resolve => setTimeout(resolve, 1000));
            
            log('\n');
            await testLeerDatos();
            
            log('\n=== FIN DEL TEST ===', 'success');
        }

        // Auto-ejecutar test al cargar
        window.addEventListener('load', () => {
            log('Página cargada. Listo para probar.', 'success');
        });
    </script>
</body>
</html>
