<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#2D3748">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="SHOR">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="application-name" content="SHOR">
    <title>SHOR - Sensor Humano de Operación Real</title>
    
    <!-- PWA Manifest -->
    <link rel="manifest" href="/shor/manifest.json">
    <meta name="theme-color" content="#2D3748">
    <link rel="apple-touch-icon" href="/shor/icon-192.png">
    
    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
            background: #F7FAFC;
            min-height: 100vh;
            color: #1A202C;
        }
        
        .header {
            background: #2D3748;
            color: white;
            padding: 16px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 100;
        }
        
        .header h1 {
            font-size: 18px;
            font-weight: 600;
        }
        
        .header-actions {
            display: flex;
            gap: 12px;
        }
        
        .install-btn {
            background: #E53E3E;
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            display: block;
        }
        
        .install-btn.hidden {
            display: none;
        }
        
        .header-btn {
            background: none;
            border: none;
            color: white;
            font-size: 20px;
            cursor: pointer;
            padding: 8px;
            border-radius: 8px;
            transition: background 0.2s;
        }
        
        .header-btn:hover {
            background: rgba(255,255,255,0.1);
        }
        
        .container {
            padding: 20px;
            max-width: 500px;
            margin: 0 auto;
        }
        
        .card {
            background: white;
            border-radius: 16px;
            padding: 20px;
            margin-bottom: 16px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
        }
        
        .date-display {
            font-size: 16px;
            color: #718096;
            margin-bottom: 8px;
        }
        
        .persona-info {
            font-size: 14px;
            color: #A0AEC0;
        }
        
        .main-actions {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-top: 20px;
        }
        
        .btn {
            padding: 16px 24px;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            transition: transform 0.1s, opacity 0.2s;
        }
        
        .btn:active {
            transform: scale(0.98);
        }
        
        .btn-primary {
            background: #48BB78;
            color: white;
            font-size: 18px;
            padding: 20px;
        }
        
        .btn-secondary {
            background: #4299E1;
            color: white;
        }
        
        .btn-outline {
            background: white;
            color: #718096;
            border: 2px solid #E2E8F0;
        }
        
        .btn-recording {
            background: #E53E3E;
            animation: pulse 1.5s infinite;
        }
        
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.7; }
        }
        
        .registros-list {
            margin-top: 20px;
        }
        
        .registros-title {
            font-size: 14px;
            color: #718096;
            margin-bottom: 12px;
            font-weight: 500;
        }
        
        .registro-item {
            background: #F7FAFC;
            padding: 12px 16px;
            border-radius: 10px;
            margin-bottom: 8px;
            display: flex;
            align-items: flex-start;
            gap: 12px;
        }
        
        .registro-icon {
            font-size: 20px;
            min-width: 28px;
        }
        
        .registro-content {
            flex: 1;
        }
        
        .registro-text {
            font-size: 14px;
            color: #2D3748;
            margin-bottom: 4px;
        }
        
        .registro-time {
            font-size: 12px;
            color: #A0AEC0;
        }
        
        /* Modal */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.5);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 200;
            padding: 20px;
        }
        
        .modal-overlay.active {
            display: flex;
        }
        
        .modal {
            background: white;
            border-radius: 20px;
            padding: 24px;
            width: 100%;
            max-width: 400px;
            max-height: 80vh;
            overflow-y: auto;
        }
        
        .modal h2 {
            font-size: 20px;
            margin-bottom: 16px;
            color: #1A202C;
        }
        
        .modal-subtitle {
            font-size: 14px;
            color: #718096;
            margin-bottom: 16px;
        }
        
        .modal textarea, .modal input {
            width: 100%;
            padding: 14px;
            border: 2px solid #E2E8F0;
            border-radius: 10px;
            font-size: 16px;
            margin-bottom: 16px;
            resize: none;
            font-family: inherit;
        }
        
        .modal textarea:focus, .modal input:focus {
            outline: none;
            border-color: #4299E1;
        }
        
        .modal-actions {
            display: flex;
            gap: 12px;
        }
        
        .modal-actions .btn {
            flex: 1;
        }
        
        /* Onboarding */
        .onboarding {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 40px 20px;
            text-align: center;
        }
        
        .onboarding-logo {
            width: 80px;
            height: 80px;
            background: #2D3748;
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 40px;
            font-weight: bold;
            margin-bottom: 24px;
        }
        
        .onboarding h1 {
            font-size: 28px;
            margin-bottom: 8px;
            color: #1A202C;
        }
        
        .onboarding p {
            font-size: 16px;
            color: #718096;
            margin-bottom: 32px;
        }
        
        .onboarding input {
            width: 100%;
            max-width: 300px;
            padding: 16px;
            border: 2px solid #E2E8F0;
            border-radius: 12px;
            font-size: 18px;
            text-align: center;
            margin-bottom: 16px;
        }
        
        .onboarding select {
            width: 100%;
            max-width: 300px;
            padding: 16px;
            border: 2px solid #E2E8F0;
            border-radius: 12px;
            font-size: 16px;
            margin-bottom: 24px;
            background: white;
        }
        
        /* Install banner */
        .install-banner {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: #2D3748;
            color: white;
            padding: 16px 20px;
            display: none;
            align-items: center;
            justify-content: space-between;
            z-index: 150;
        }
        
        .install-banner.show {
            display: flex;
        }
        
        .install-banner p {
            font-size: 14px;
        }
        
        .install-banner .btn {
            padding: 10px 20px;
            font-size: 14px;
        }
        
        /* Empty state */
        .empty-state {
            text-align: center;
            padding: 40px 20px;
            color: #A0AEC0;
        }
        
        .empty-state-icon {
            font-size: 48px;
            margin-bottom: 16px;
        }
    </style>
</head>
<body>
    <!-- Onboarding Screen -->
    <div id="onboarding" class="onboarding">
        <div class="onboarding-logo">S</div>
        <h1>SHOR</h1>
        <p>Sensor Humano de Operación Real</p>
        
        <input type="text" id="nombreInput" placeholder="Tu nombre" autocomplete="off">
        
        <select id="rolSelect">
            <option value="">Selecciona tu rol</option>
            <option value="Director">Director</option>
            <option value="Operativo">Operativo</option>
            <option value="Producción">Producción</option>
            <option value="Almacén">Almacén</option>
            <option value="Ventas">Ventas</option>
            <option value="Administrativo">Administrativo</option>
            <option value="Mantenimiento">Mantenimiento</option>
            <option value="Doméstico">Doméstico</option>
        </select>
        
        <button class="btn btn-primary" onclick="iniciarApp()">Comenzar</button>
    </div>
    
    <!-- Main App -->
    <div id="app" style="display: none;">
        <header class="header">
            <h1 id="headerTitle">Hola, Usuario</h1>
            <div class="header-actions">
                <button class="install-btn" id="installBtn" onclick="installApp()">📱 Instalar App</button>
                <button class="header-btn" onclick="showExportModal()" title="Exportar">📤</button>
            </div>
        </header>
        
        <div class="container">
            <div class="card">
                <div class="date-display" id="dateDisplay"></div>
                <div class="persona-info" id="personaInfo"></div>
            </div>
            
            <div class="main-actions">
                <div id="transcriptionPreview" style="display: none; background: #EDF2F7; padding: 16px; border-radius: 12px; margin-bottom: 16px;">
                    <div style="font-size: 14px; color: #718096; margin-bottom: 8px;">🎤 Dictando...</div>
                    <div id="transcriptionText" style="color: #2D3748; font-size: 16px; line-height: 1.5;"></div>
                </div>
                
                <button class="btn btn-primary" id="recordBtn" onclick="toggleVoiceTranscription()">
                    🎤 Dictar nota por voz
                </button>
                
                <button class="btn btn-secondary" onclick="showTextModal()">
                    ✏️ Escribir nota
                </button>
                
                <button class="btn btn-outline" onclick="registrarSkip()">
                    ⏭️ Nada relevante hoy
                </button>
            </div>
            
            <div class="registros-list">
                <div class="registros-title">Registros de hoy</div>
                <div id="registrosList"></div>
            </div>
            
            <div class="card" style="margin-top: 20px;">
                <div class="registros-title">📊 Resumen completo</div>
                <button class="btn btn-outline" onclick="toggleResumenCompleto()" style="width: 100%; margin-top: 12px;">
                    <span id="resumenToggleText">Ver todas las tareas</span>
                </button>
                <div id="resumenCompleto" style="display: none; margin-top: 16px;"></div>
            </div>
        </div>
    </div>
    
    <!-- Text Modal -->
    <div class="modal-overlay" id="textModal">
        <div class="modal">
            <h2>✏️ Escribe tu nota</h2>
            <p class="modal-subtitle">¿Qué pasó hoy que valga la pena recordar?</p>
            <textarea id="notaTextarea" rows="4" placeholder="Escribe aquí..."></textarea>
            <div class="modal-actions">
                <button class="btn btn-outline" onclick="closeTextModal()">Cancelar</button>
                <button class="btn btn-secondary" onclick="guardarNota()">Guardar</button>
            </div>
        </div>
    </div>
    
    <!-- Export Modal -->
    <div class="modal-overlay" id="exportModal">
        <div class="modal">
            <h2>📤 Exportar reporte</h2>
            <p class="modal-subtitle">¿Qué opinas de la app hoy?</p>
            <textarea id="opinionTextarea" rows="2" placeholder="Ej: Fácil de usar, me gusta..."></textarea>
            <div class="modal-actions">
                <button class="btn btn-outline" onclick="closeExportModal()">Cancelar</button>
                <button class="btn btn-primary" onclick="exportarReporte()">Exportar</button>
            </div>
        </div>
    </div>
    
    <!-- Install Banner -->
    <div class="install-banner" id="installBanner">
        <p>📱 Instalar SHOR como app</p>
        <button class="btn btn-primary" onclick="installApp()">Instalar</button>
    </div>
    
    <script>
        // ============================================
        // SHOR PWA - Sensor Humano de Operación Real
        // Versión: 2.0.0
        // Almacenamiento: IndexedDB local + Firebase sync
        // ============================================
        
        let db;
        let persona = null;
        let registros = [];
        let mediaRecorder = null;
        let recognition = null;
        let isTranscribing = false;
        let deferredPrompt = null;
        let firestoreDB = null;
        let deviceId = null;
        
        // ============================================
        // Firebase Configuration
        // ============================================
        
        const firebaseConfig = {
            apiKey: "AIzaSyCVuKY4yYUawd50iUFbTeYFWcZd2Lmvv_Q",
            authDomain: "shor-pwa.firebaseapp.com",
            projectId: "shor-pwa",
            storageBucket: "shor-pwa.firebasestorage.app",
            messagingSenderId: "113185407112",
            appId: "1:113185407112:web:e8f7b0a5d4c3b2a1f6e5d4"
        };
        
        // Inicializar Firebase Firestore
        function initFirebase() {
            try {
                if (firebaseConfig.apiKey !== "TU_API_KEY") {
                    firebase.initializeApp(firebaseConfig);
                    firestoreDB = firebase.firestore();
                    console.log('[Firestore] Inicializado correctamente');
                    
                    // Generar o recuperar device ID
                    deviceId = localStorage.getItem('deviceId');
                    if (!deviceId) {
                        deviceId = 'device_' + Date.now() + '_' + Math.random().toString(36).substr(2, 9);
                        localStorage.setItem('deviceId', deviceId);
                    }
                    console.log('[Firestore] Device ID:', deviceId);
                    
                    // Sincronizar datos al iniciar
                    syncFromFirestore();
                }
            } catch (error) {
                console.error('[Firestore] Error al inicializar:', error);
            }
        }
        
        // Sincronizar datos a Firestore
        async function syncToFirestore(data) {
            if (!firestoreDB || !deviceId) return;
            
            try {
                await firestoreDB.collection('users').doc(deviceId).set({
                    persona: persona,
                    registros: registros,
                    lastSync: new Date().toISOString()
                }, { merge: true });
                console.log('[Firestore] Datos sincronizados');
            } catch (error) {
                console.error('[Firestore] Error al sincronizar:', error);
            }
        }
        
        // Recuperar datos de Firestore
        async function syncFromFirestore() {
            if (!firestoreDB || !deviceId) return;
            
            try {
                const doc = await firestoreDB.collection('users').doc(deviceId).get();
                if (doc.exists) {
                    const data = doc.data();
                    console.log('[Firestore] Datos recuperados:', data);
                    if (data.persona && !persona) {
                        persona = data.persona;
                    }
                    if (data.registros && Array.isArray(data.registros)) {
                        registros = data.registros;
                    }
                }
            } catch (error) {
                console.error('[Firestore] Error al recuperar datos:', error);
            }
        }
        
        // ============================================
        // IndexedDB Setup
        // ============================================
        
        function initDB() {
            return new Promise((resolve, reject) => {
                const request = indexedDB.open('SHOR_DB', 1);
                
                request.onerror = () => reject(request.error);
                request.onsuccess = () => {
                    db = request.result;
                    resolve(db);
                };
                
                request.onupgradeneeded = (event) => {
                    const database = event.target.result;
                    
                    // Personas store
                    if (!database.objectStoreNames.contains('personas')) {
                        database.createObjectStore('personas', { keyPath: 'id' });
                    }
                    
                    // Registros store
                    if (!database.objectStoreNames.contains('registros')) {
                        const store = database.createObjectStore('registros', { keyPath: 'id' });
                        store.createIndex('fecha', 'fecha', { unique: false });
                        store.createIndex('personaId', 'personaId', { unique: false });
                    }
                    
                    // Reportes enviados store
                    if (!database.objectStoreNames.contains('reportes')) {
                        database.createObjectStore('reportes', { keyPath: 'id' });
                    }
                };
            });
        }
        
        // ============================================
        // DB Operations
        // ============================================
        
        function dbAdd(storeName, data) {
            return new Promise((resolve, reject) => {
                const tx = db.transaction(storeName, 'readwrite');
                const store = tx.objectStore(storeName);
                const request = store.add(data);
                request.onsuccess = () => resolve(request.result);
                request.onerror = () => reject(request.error);
            });
        }
        
        function dbGet(storeName, key) {
            return new Promise((resolve, reject) => {
                const tx = db.transaction(storeName, 'readonly');
                const store = tx.objectStore(storeName);
                const request = store.get(key);
                request.onsuccess = () => resolve(request.result);
                request.onerror = () => reject(request.error);
            });
        }
        
        function dbGetAll(storeName) {
            return new Promise((resolve, reject) => {
                const tx = db.transaction(storeName, 'readonly');
                const store = tx.objectStore(storeName);
                const request = store.getAll();
                request.onsuccess = () => resolve(request.result);
                request.onerror = () => reject(request.error);
            });
        }
        
        // ============================================
        // App Initialization
        // ============================================
        
        // Register Service Worker
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('/shor/sw.js')
                .then(reg => console.log('[SW] Registrado:', reg.scope))
                .catch(err => console.error('[SW] Error:', err));
        }
        
        async function init() {
            await initDB();
            initFirebase();
            
            // Check if persona exists
            const personas = await dbGetAll('personas');
            if (personas.length > 0) {
                persona = personas[0];
                registros = await dbGetAll('registros');
                showApp();
            }
            
            // PWA install detection
            detectPWAInstall();
        }
        
        async function iniciarApp() {
            const nombre = document.getElementById('nombreInput').value.trim();
            const rol = document.getElementById('rolSelect').value;
            
            if (!nombre || !rol) {
                alert('Por favor completa tu nombre y rol');
                return;
            }
            
            persona = {
                id: 'persona_' + Date.now(),
                nombre: nombre,
                rol: rol,
                createdAt: new Date().toISOString()
            };
            
            await dbAdd('personas', persona);
            
            // Sincronizar persona a Firestore
            if (firestoreDB && deviceId) {
                try {
                    await firestoreDB.collection('users').doc(deviceId).set({
                        persona: persona,
                        createdAt: new Date().toISOString()
                    }, { merge: true });
                    console.log('[Firestore] Persona guardada');
                } catch (error) {
                    console.error('[Firestore] Error al guardar persona:', error);
                }
            }
            
            showApp();
        }
        
        function showApp() {
            document.getElementById('onboarding').style.display = 'none';
            document.getElementById('app').style.display = 'block';
            
            document.getElementById('headerTitle').textContent = `Hola, ${persona.nombre}`;
            document.getElementById('personaInfo').textContent = persona.rol;
            
            updateDateDisplay();
            loadRegistrosHoy();
            
            // Mostrar resumen completo automáticamente
            setTimeout(() => {
                toggleResumenCompleto();
            }, 500);
        }
        
        function updateDateDisplay() {
            const now = new Date();
            const options = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
            const dateStr = now.toLocaleDateString('es-MX', options);
            document.getElementById('dateDisplay').textContent = dateStr.charAt(0).toUpperCase() + dateStr.slice(1);
        }
        
        async function loadRegistrosHoy() {
            const allRegistros = await dbGetAll('registros');
            const hoy = new Date().toISOString().split('T')[0];
            registros = allRegistros.filter(r => r.fecha === hoy && r.personaId === persona.id);
            renderRegistros();
        }
        
        function renderRegistros() {
            const container = document.getElementById('registrosList');
            
            if (registros.length === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        <div class="empty-state-icon">📝</div>
                        <p>Sin registros hoy</p>
                    </div>
                `;
                return;
            }
            
            container.innerHTML = registros.map(r => {
                const icon = r.tipo === 'voz' ? '🎤' : r.tipo === 'texto' ? '✏️' : '⏭️';
                const time = new Date(r.timestamp).toLocaleTimeString('es-MX', { hour: '2-digit', minute: '2-digit' });
                return `
                    <div class="registro-item">
                        <div class="registro-icon">${icon}</div>
                        <div class="registro-content">
                            <div class="registro-text">${r.contenido || r.tipo}</div>
                            <div class="registro-time">${time}</div>
                        </div>
                    </div>
                `;
            }).join('');
        }
        
        // ============================================
        // Voice Transcription (Speech to Text)
        // ============================================
        
        function toggleVoiceTranscription() {
            if (isTranscribing) {
                stopVoiceTranscription();
            } else {
                startVoiceTranscription();
            }
        }
        
        function startVoiceTranscription() {
            if (!('webkitSpeechRecognition' in window) && !('SpeechRecognition' in window)) {
                alert('Tu navegador no soporta reconocimiento de voz. Usa Chrome.');
                return;
            }
            
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            recognition = new SpeechRecognition();
            recognition.lang = 'es-MX';
            recognition.continuous = false; // Cambiar a false para Android
            recognition.interimResults = true;
            recognition.maxAlternatives = 1;
            
            let finalTranscript = '';
            let restartCount = 0;
            const maxRestarts = 10;
            
            // Mostrar preview
            const preview = document.getElementById('transcriptionPreview');
            const previewText = document.getElementById('transcriptionText');
            preview.style.display = 'block';
            previewText.textContent = '';
            
            recognition.onstart = () => {
                isTranscribing = true;
                const btn = document.getElementById('recordBtn');
                btn.innerHTML = '⏹️ Detener dictado';
                btn.classList.add('btn-recording');
                console.log('[Voice] Transcripción iniciada');
            };
            
            recognition.onresult = (event) => {
                let interimTranscript = '';
                
                for (let i = event.resultIndex; i < event.results.length; i++) {
                    const transcript = event.results[i][0].transcript;
                    if (event.results[i].isFinal) {
                        finalTranscript += transcript + ' ';
                        console.log('[Voice] Texto final acumulado:', finalTranscript);
                    } else {
                        interimTranscript += transcript;
                    }
                }
                
                // Mostrar en tiempo real
                const fullText = finalTranscript + interimTranscript;
                previewText.textContent = fullText || 'Escuchando...';
                console.log('[Voice] Transcribiendo...', fullText);
            };
            
            recognition.onerror = (event) => {
                console.error('[Voice] Error:', event.error);
                
                if (event.error === 'no-speech') {
                    // Reintentar automáticamente si no detecta voz
                    if (isTranscribing && restartCount < maxRestarts) {
                        restartCount++;
                        console.log('[Voice] Reintentando...', restartCount);
                        setTimeout(() => {
                            if (isTranscribing) {
                                try {
                                    recognition.start();
                                } catch (e) {
                                    console.error('[Voice] Error al reintentar:', e);
                                }
                            }
                        }, 100);
                    } else {
                        alert('No se detectó voz. Toca el botón de nuevo para continuar.');
                        stopVoiceTranscription();
                    }
                } else if (event.error === 'not-allowed') {
                    alert('Permisos de micrófono denegados. Permite el acceso al micrófono.');
                    stopVoiceTranscription();
                } else if (event.error === 'aborted') {
                    // Ignorar aborted, es normal al detener
                    console.log('[Voice] Transcripción detenida');
                } else {
                    alert('Error: ' + event.error);
                    stopVoiceTranscription();
                }
            };
            
            recognition.onend = () => {
                console.log('[Voice] Recognition ended, isTranscribing:', isTranscribing);
                
                // Si sigue transcribiendo, reiniciar automáticamente
                if (isTranscribing && restartCount < maxRestarts) {
                    restartCount++;
                    console.log('[Voice] Auto-restart', restartCount);
                    setTimeout(() => {
                        if (isTranscribing) {
                            try {
                                recognition.start();
                            } catch (e) {
                                console.error('[Voice] Error al auto-reiniciar:', e);
                                stopVoiceTranscription();
                            }
                        }
                    }, 100);
                } else {
                    // Guardar si hay texto
                    if (finalTranscript.trim()) {
                        guardarRegistro('voz', finalTranscript.trim()).then(() => {
                            console.log('[Voice] Nota guardada:', finalTranscript);
                        });
                    }
                    stopVoiceTranscription();
                }
            };
            
            try {
                recognition.start();
            } catch (err) {
                console.error('[Voice] Error al iniciar:', err);
                alert('Error al iniciar reconocimiento de voz');
                stopVoiceTranscription();
            }
        }
        
        function stopVoiceTranscription() {
            isTranscribing = false;
            
            if (recognition) {
                try {
                    recognition.stop();
                } catch (e) {
                    console.error('[Voice] Error al detener:', e);
                }
                recognition = null;
            }
            
            const btn = document.getElementById('recordBtn');
            btn.innerHTML = '🎤 Dictar nota por voz';
            btn.classList.remove('btn-recording');
            
            // Ocultar preview
            const preview = document.getElementById('transcriptionPreview');
            preview.style.display = 'none';
        }
        
        // ============================================
        // Text Notes
        // ============================================
        
        function showTextModal() {
            document.getElementById('textModal').classList.add('active');
            document.getElementById('notaTextarea').focus();
        }
        
        function closeTextModal() {
            document.getElementById('textModal').classList.remove('active');
            document.getElementById('notaTextarea').value = '';
        }
        
        async function guardarNota() {
            const nota = document.getElementById('notaTextarea').value.trim();
            if (!nota) {
                alert('Escribe algo antes de guardar');
                return;
            }
            
            await guardarRegistro('texto', nota);
            closeTextModal();
        }
        
        async function registrarSkip() {
            await guardarRegistro('skip', 'Nada relevante hoy');
        }
        
        // ============================================
        // Save Record
        // ============================================
        
        async function guardarRegistro(tipo, contenido, audioData = null) {
            const registro = {
                id: 'reg_' + Date.now() + '_' + Math.random().toString(36).substr(2, 9),
                personaId: persona.id,
                tipo: tipo,
                contenido: contenido,
                audioData: audioData,
                fecha: new Date().toISOString().split('T')[0],
                timestamp: new Date().toISOString()
            };
            
            // Guardar en IndexedDB local
            await dbAdd('registros', registro);
            registros.push(registro);
            renderRegistros();
            
            // Guardar INMEDIATAMENTE en Firestore (tiempo real)
            if (firestoreDB && deviceId) {
                try {
                    await firestoreDB.collection('registros').doc(deviceId)
                        .collection('items').doc(registro.id).set(registro);
                    console.log('[Firestore] Registro guardado en tiempo real:', registro.id);
                    console.log('[Firestore] Ruta:', 'registros/' + deviceId + '/items/' + registro.id);
                } catch (error) {
                    console.error('[Firestore] Error al guardar registro:', error);
                    console.error('[Firestore] Código de error:', error.code);
                    console.error('[Firestore] Mensaje:', error.message);
                    
                    // Mostrar alerta si es error de permisos
                    if (error.code === 'permission-denied') {
                        alert('⚠️ Error de Firestore\n\nLas notas se guardan localmente pero NO en Firestore.\n\nConfigura las reglas en:\nconsole.firebase.google.com/project/shor-pwa/firestore');
                    }
                }
            } else {
                console.warn('[Firestore] No inicializado. Guardado solo local.');
            }
            
            // Vibrate for feedback
            if (navigator.vibrate) {
                navigator.vibrate(50);
            }
        }
        
        // ============================================
        // Export
        // ============================================
        
        function showExportModal() {
            document.getElementById('exportModal').classList.add('active');
            document.getElementById('opinionTextarea').focus();
        }
        
        function closeExportModal() {
            document.getElementById('exportModal').classList.remove('active');
            document.getElementById('opinionTextarea').value = '';
        }
        
        async function exportarReporte() {
            const opinion = document.getElementById('opinionTextarea').value.trim();
            if (!opinion) {
                alert('Por favor escribe tu opinión de la app');
                return;
            }
            
            if (!firestoreDB || !deviceId) {
                alert('Firestore no está configurado. Los datos solo están guardados localmente.');
                closeExportModal();
                return;
            }
            
            const allRegistros = await dbGetAll('registros');
            const allReportes = await dbGetAll('reportes');
            
            // Get last export date
            const lastExport = allReportes.length > 0 
                ? allReportes.sort((a, b) => new Date(b.fecha) - new Date(a.fecha))[0].fecha 
                : null;
            
            // Filter registros not yet exported
            let registrosParaExportar = allRegistros.filter(r => r.personaId === persona.id);
            if (lastExport) {
                registrosParaExportar = registrosParaExportar.filter(r => r.fecha > lastExport);
            }
            
            if (registrosParaExportar.length === 0) {
                alert('No hay registros nuevos para exportar');
                closeExportModal();
                return;
            }
            
            // Determine report ID
            const fechas = registrosParaExportar.map(r => r.fecha).sort();
            const fechaInicio = fechas[0];
            const fechaFin = fechas[fechas.length - 1];
            
            const reportId = 'rep_' + Date.now();
            
            // Build export data
            const exportData = {
                shor_export: {
                    version: '1.0.0',
                    export_id: reportId,
                    export_date: new Date().toISOString(),
                    periodo: {
                        desde: fechaInicio,
                        hasta: fechaFin
                    },
                    persona: {
                        id: persona.id,
                        nombre: persona.nombre,
                        rol: persona.rol
                    },
                    opinion_del_dia: opinion,
                    registros: registrosParaExportar.map(r => ({
                        id: r.id,
                        tipo: r.tipo,
                        contenido: r.contenido,
                        fecha: r.fecha,
                        timestamp: r.timestamp
                    })),
                    total_registros: registrosParaExportar.length,
                    check_reportes_anteriores: allReportes.map(r => ({
                        fecha: r.fecha,
                        opinion: r.opinion
                    })),
                    meta_flujo: {
                        ultimo_export: lastExport,
                        dias_sin_exportar: lastExport 
                            ? Math.floor((new Date() - new Date(lastExport)) / (1000 * 60 * 60 * 24))
                            : null,
                        observado_por: 'RUIDO',
                        tipo_nutriente: 'SHOR_EXPORT'
                    }
                }
            };
            
            // Save report record locally
            const reporteRecord = {
                id: reportId,
                fecha: fechaFin,
                opinion: opinion,
                timestamp: new Date().toISOString()
            };
            await dbAdd('reportes', reporteRecord);
            
            // Guardar SOLO en Firestore (sin descarga)
            try {
                await firestoreDB.collection('exports').doc(deviceId)
                    .collection('reports').doc(reportId).set(exportData);
                console.log('[Firestore] Reporte guardado en Firestore:', reportId);
                
                closeExportModal();
                alert('✓ Reporte guardado en Firestore\n\nID: ' + reportId + '\nRegistros: ' + registrosParaExportar.length);
            } catch (error) {
                alert('❌ Error al guardar en Firestore: ' + error.message);
                closeExportModal();
            }
        }
        
        function shareToWhatsApp(mensaje) {
            const encoded = encodeURIComponent(mensaje);
            window.open(`https://wa.me/?text=${encoded}`, '_blank');
        }
        
        // ============================================
        // PWA Install
        // ============================================
        
        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
            deferredPrompt = e;
            console.log('[PWA] Install prompt disponible');
        });
        
        window.addEventListener('appinstalled', () => {
            console.log('[PWA] App instalada');
            deferredPrompt = null;
            const installBtn = document.getElementById('installBtn');
            if (installBtn) {
                installBtn.classList.add('hidden');
            }
        });
        
        function detectPWAInstall() {
            checkIfInstalled();
        }
        
        // Verificar si ya está instalado (múltiples métodos para Android)
        function checkIfInstalled() {
            const isStandalone = window.matchMedia('(display-mode: standalone)').matches;
            const isIOSStandalone = window.navigator.standalone === true;
            const isAndroidInstalled = document.referrer.includes('android-app://');
            
            if (isStandalone || isIOSStandalone || isAndroidInstalled) {
                const installBtn = document.getElementById('installBtn');
                if (installBtn) {
                    installBtn.classList.add('hidden');
                }
                return true;
            }
            return false;
        }
        
        checkIfInstalled();
        
        async function installApp() {
            if (deferredPrompt) {
                try {
                    deferredPrompt.prompt();
                    const { outcome } = await deferredPrompt.userChoice;
                    console.log('[PWA] User choice:', outcome);
                    if (outcome === 'accepted') {
                        const installBtn = document.getElementById('installBtn');
                        if (installBtn) {
                            installBtn.classList.add('hidden');
                        }
                    }
                    deferredPrompt = null;
                } catch (err) {
                    console.error('[PWA] Error al instalar:', err);
                    alert('Error al instalar la app. Intenta desde el menú del navegador (⋮ → Instalar app)');
                }
            } else {
                // Dar instrucciones específicas para Android
                if (checkIfInstalled()) {
                    alert('✓ La app ya está instalada');
                } else {
                    alert('Para instalar en Android:\n\n1. Toca el menú (⋮) arriba a la derecha\n2. Selecciona "Instalar app" o "Agregar a pantalla de inicio"');
                }
            }
        }
        
        // ============================================
        // Resumen Completo
        // ============================================
        
        let resumenVisible = false;
        
        async function toggleResumenCompleto() {
            resumenVisible = !resumenVisible;
            const container = document.getElementById('resumenCompleto');
            const toggleText = document.getElementById('resumenToggleText');
            
            if (resumenVisible) {
                container.style.display = 'block';
                toggleText.textContent = 'Ocultar resumen';
                await renderResumenCompleto();
            } else {
                container.style.display = 'none';
                toggleText.textContent = 'Ver todas las tareas';
            }
        }
        
        async function renderResumenCompleto() {
            const container = document.getElementById('resumenCompleto');
            const allRegistros = await dbGetAll('registros');
            const registrosPorFecha = {};
            
            // Agrupar por fecha
            allRegistros.forEach(r => {
                if (!registrosPorFecha[r.fecha]) {
                    registrosPorFecha[r.fecha] = [];
                }
                registrosPorFecha[r.fecha].push(r);
            });
            
            // Ordenar fechas descendente
            const fechas = Object.keys(registrosPorFecha).sort().reverse();
            
            if (fechas.length === 0) {
                container.innerHTML = '<p style="color: #718096; text-align: center; padding: 20px;">No hay registros aún</p>';
                return;
            }
            
            let html = '<div style="max-height: 400px; overflow-y: auto;">';
            
            fechas.forEach(fecha => {
                const registrosDia = registrosPorFecha[fecha];
                const fechaObj = new Date(fecha + 'T00:00:00');
                const fechaStr = fechaObj.toLocaleDateString('es-MX', { weekday: 'short', month: 'short', day: 'numeric' });
                
                html += `
                    <div style="margin-bottom: 20px; padding-bottom: 16px; border-bottom: 1px solid #E2E8F0;">
                        <div style="font-weight: 600; color: #2D3748; margin-bottom: 8px;">${fechaStr}</div>
                `;
                
                registrosDia.forEach(r => {
                    const icon = r.tipo === 'voz' ? '🎤' : r.tipo === 'texto' ? '✏️' : '⏭️';
                    const time = new Date(r.timestamp).toLocaleTimeString('es-MX', { hour: '2-digit', minute: '2-digit' });
                    html += `
                        <div style="display: flex; gap: 12px; margin-bottom: 8px; padding: 8px; background: #F7FAFC; border-radius: 8px;">
                            <div style="font-size: 20px;">${icon}</div>
                            <div style="flex: 1;">
                                <div style="color: #2D3748; font-size: 14px;">${r.contenido || r.tipo}</div>
                                <div style="color: #718096; font-size: 12px; margin-top: 4px;">${time}</div>
                            </div>
                        </div>
                    `;
                });
                
                html += '</div>';
            });
            
            html += '</div>';
            html += `<div style="margin-top: 12px; padding: 12px; background: #EDF2F7; border-radius: 8px; text-align: center; color: #4A5568; font-size: 14px;">Total: ${allRegistros.length} registros</div>`;
            
            container.innerHTML = html;
        }
        
        // ============================================
        // Service Worker Registration
        // ============================================
        
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./service-worker.js')
                    .then(reg => console.log('[SW] Registered'))
                    .catch(err => console.log('[SW] Registration failed:', err));
            });
        }
        
        // ============================================
        // Initialize
        // ============================================
        
        init();
    </script>
</body>
